<!doctype html>
<!--
  An operating screen that embeds a third-party player (tubrief-v2 #113). The
  production video page holds a YouTube iframe; measured directly, the page
  was taken for a preview shell because it had a child frame, the embed was
  waited on for `data-comp-ready` it can never declare, and the run stopped at
  30s. The surface is this page; the embed is part of it, not a frame to
  measure.

  The player is served from `localhost` while the page is opened on
  `127.0.0.1`: another origin, as a YouTube embed is. It never declares ready.

  node <skill>/fixtures/serve.mjs 4792 -- node <skill>/scripts/measure-surface.mjs \
    --urls http://127.0.0.1:4792/embedded-player.html \
    --viewport 1440 --height 900 --sweep off --out /tmp/embedded-player.json
  (from a project root that resolves Playwright)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>embedded player fixture</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { padding: 24px; display: grid; gap: 16px; justify-items: start; }
      h1 { font-size: 40px; margin: 0; }
      iframe { width: 640px; height: 360px; border: 0; background: #000; }
      button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; font: inherit; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <h1>Talk</h1>
      <iframe title="player"></iframe>
      <button type="button" data-comp-control="play" data-comp-accent="1">Play</button>
    </main>
    <script>
      const embed = new URL("embedded-player-frame.html", location.href);
      embed.hostname = "localhost";
      document.querySelector("iframe").src = embed.href;
      const play = document.querySelector("button");
      play.addEventListener("click", () => { play.textContent = play.textContent === "Play" ? "Pause" : "Play"; });
      document.documentElement.setAttribute("data-comp-ready", "");
    </script>
  </body>
</html>
