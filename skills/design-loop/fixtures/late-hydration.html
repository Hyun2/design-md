<!doctype html>
<!--
  Operability under a page that is not ready yet (tubrief-v2 #79). A dev
  server that had not bundled its dependencies served pages whose handlers
  attached late, and reloaded them under the check; the same commit failed
  four live controls as dead on one run and passed on the next.

  Handlers attach 2.5s after load — long after `networkidle` has fired, as a
  cold dev server's did — and only then does the page declare `data-comp-ready`.

  node <skill>/scripts/measure-surface.mjs --urls file://<this file> \
    --viewport 1440 --height 900 --out /tmp/late-hydration.json
  (from a project root that resolves Playwright)

  Passes as committed. The red is a mutation commit in which pressing Alpha
  leaves the next document without Beta's handler — Beta answers on one
  document and not on another, as in #79 — followed by its revert.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>late hydration fixture</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { padding: 24px; display: grid; gap: 16px; justify-items: start; }
      button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; }
      output { display: block; min-height: 24px; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <div><button type="button" data-comp-control="alpha" data-comp-accent="1">Alpha</button></div>
      <div><button type="button" data-comp-control="beta">Beta</button></div>
      <output></output>
    </main>
    <script>
      setTimeout(() => {
        const output = document.querySelector("output");
        for (const button of document.querySelectorAll("button")) {
          button.addEventListener("click", () => { output.textContent = `pressed ${button.textContent}`; });
        }
        document.documentElement.setAttribute("data-comp-ready", "");
      }, 2500);
    </script>
  </body>
</html>
