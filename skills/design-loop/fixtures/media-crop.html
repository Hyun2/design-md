<!doctype html>
<!--
  Relational criterion 9 (media crop), the height-cap form: a 16:9 box whose
  height is capped stretches wide at a short window and object-fit: cover trims
  the picture's top and bottom (2026-09 TuBrief G1, Reader stage). The frame
  keeps its ratio by capping the width derived from the height budget instead.

  node <skill>/scripts/measure-surface.mjs --urls file://<this file> \
    --viewport 1440 --height 900 --out /tmp/media-crop.json
  (from a project root that resolves Playwright)

  Passes as committed. The red is a mutation commit that moves the cap back to
  `max-height: 54vh`, followed by its revert.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>media crop fixture</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      .stage {
        aspect-ratio: 16 / 9;
        width: 100%;
        max-height: 54vh;
        margin: 0 auto;
        overflow: hidden;
      }
      .stage img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .bar { padding: 16px; }
      .bar button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; }
    </style>
  </head>
  <body>
    <div data-comp-world>
      <div class="stage">
        <img
          alt="16:9 picture"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><rect width='1600' height='900' fill='%23345'/><circle cx='800' cy='450' r='300' fill='%23789'/></svg>"
        />
      </div>
      <div class="bar">
        <button type="button" data-comp-control="action" data-comp-accent="1" data-comp-inert="fixture: nothing to operate">Play</button>
      </div>
    </div>
  </body>
</html>
