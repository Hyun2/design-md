<!doctype html>
<!--
  A comp of embedded-player.html for a screen whose player differs by source
  (tubrief-v2 #120). It declares the embed the operating screen shows, and
  also a native `video` region and a dropped "Download" control that this
  baseline does not have: the TuBrief Reader declared both a YouTube and a
  Local `video` region, the baseline opened a YouTube record only, and the
  `video` sentence was approved though no command had read it. At the red
  commit the two declarations vanish from the output.

  node <skill>/fixtures/serve.mjs 4798 -- node <skill>/scripts/measure-surface.mjs \
    --urls http://127.0.0.1:4798/unchecked-comp.html \
    --baseline http://127.0.0.1:4798/embedded-player.html \
    --viewport 1440 --height 900 --sweep off --out /tmp/unchecked.json
  (from a project root that resolves Playwright)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>unchecked comp</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { padding: 24px; display: grid; gap: 16px; justify-items: start; }
      h1 { font-size: 40px; margin: 0; }
      .poster { width: 640px; height: 360px; background: #333; }
      button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; font: inherit; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <h1>Talk</h1>
      <div class="poster"></div>
      <button type="button" data-comp-control="play" data-comp-accent="1">Play</button>
      <i hidden data-comp-opaque="localhost:4798">the player's own controls are kept once playback starts; the poster covers them before</i>
      <i hidden data-comp-opaque="video">the browser's media controls are kept once playback starts</i>
      <i hidden data-comp-dropped="Download">the download moves to the transcript panel</i>
    </main>
    <script>
      const play = document.querySelector("button");
      play.addEventListener("click", () => { play.textContent = play.textContent === "Play" ? "Pause" : "Play"; });
      document.documentElement.setAttribute("data-comp-ready", "");
    </script>
  </body>
</html>
