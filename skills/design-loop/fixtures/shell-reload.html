<!doctype html>
<!--
  A preview shell that reloads itself in the middle of the operability check
  (tubrief-v2 #116). A dev server re-optimising dependencies reloads the whole
  page, shell included; the check held the shell's <iframe> handle, reloaded
  the frame through it, met "Execution context was destroyed", and the run
  died without writing its output (tubrief-v2 5119742: 390 and 768).

  The first press of "Rebuild" in the frame reloads this shell once, as the
  dev server did. The press itself is a live control on the fresh document.

  node <skill>/fixtures/serve.mjs 4794 -- node <skill>/scripts/measure-surface.mjs \
    --urls http://127.0.0.1:4794/shell-reload.html --labels shell \
    --viewport 1440 --height 900 --sweep off --out /tmp/shell-reload.json
  (from a project root that resolves Playwright)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>shell reload fixture</title>
    <style>body { margin: 0; background: #222; } iframe { width: 390px; height: 844px; border: 0; }</style>
  </head>
  <body>
    <iframe title="mobile" src="shell-reload-frame.html"></iframe>
    <script>
      addEventListener("message", (event) => {
        if (event.data !== "rebuild" || sessionStorage.getItem("reloaded")) return;
        sessionStorage.setItem("reloaded", "1");
        location.reload();
      });
      document.documentElement.setAttribute("data-comp-ready", "");
    </script>
  </body>
</html>
