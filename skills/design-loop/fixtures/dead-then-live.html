<!doctype html>
<!--
  A control that is dead on one run and live on the next (tubrief-v2 #124).
  On a Reader at 768 light, two working controls were judged dead on the first
  document and again on the re-judged one, so the run failed as a defect, not
  as `unstable`; the re-run passed and wrote over the failed run's output, and
  nothing was left to tell what had happened.

  The page asks the server how many times it has been loaded (`/hits`) and
  attaches Panel's handler only from the third load on: the run's first
  document and its re-judgement both see a dead control, the next run a live
  one. Two runs to one `--out`, then the failed run is looked for:

  node <skill>/fixtures/serve.mjs 4799 -- sh -c '
    rm -f /tmp/dead-then-live*.json
    node <skill>/scripts/measure-surface.mjs --urls http://127.0.0.1:4799/dead-then-live.html \
      --viewport 1440 --height 900 --sweep off --out /tmp/dead-then-live.json
    node <skill>/scripts/measure-surface.mjs --urls http://127.0.0.1:4799/dead-then-live.html \
      --viewport 1440 --height 900 --sweep off --out /tmp/dead-then-live.json &&
    grep -l "\"judgements\"" /tmp/dead-then-live.failed-*.json'
  (from a project root that resolves Playwright; needs http for /hits)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dead then live fixture</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { padding: 24px; display: grid; gap: 16px; justify-items: start; }
      button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; }
      output { display: block; min-height: 24px; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <div><button type="button" data-comp-control="panel" data-comp-accent="1">Panel</button></div>
      <output></output>
    </main>
    <script>
      fetch("/hits?key=dead-then-live")
        .then((response) => response.json())
        .then(({ n }) => {
          if (n > 2) {
            const output = document.querySelector("output");
            document.querySelector("button").addEventListener("click", () => { output.textContent = "panel open"; });
          }
          document.documentElement.setAttribute("data-comp-ready", "");
        });
    </script>
  </body>
</html>
