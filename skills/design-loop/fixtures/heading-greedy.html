<!doctype html>
<!--
  Relational criterion 11 (heading fill), the greedy form: a 40px heading under
  plain `text-wrap: wrap` whose two long words cannot share a line, set in a
  padded column. Every line already holds as much as fits, so nothing about
  the wrapping can be fixed; a judgement against the padded parent, or one
  that ignores how the heading wraps, fails it anyway (2026-10 TuBrief #88:
  「저스트 채팅 & 무엇이든」 was 303px, the next word took it to 455px in a
  426px heading box, and the parent's 442px with padding made it 68.7%).

  node <skill>/scripts/measure-surface.mjs --urls file://<this file> \
    --viewport 1440 --height 900 --out /tmp/heading-greedy.json
  (from a project root that resolves Playwright)

  Exit 0 when the heading passes criterion 11, 1 when it fails.
-->
<html lang="en" data-comp-ready>
  <head>
    <meta charset="utf-8" />
    <title>heading greedy fixture</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      .column { box-sizing: border-box; width: 640px; max-width: 100%; margin: 48px auto; padding: 0 40px; }
      h1 { margin: 0; font-size: 40px; line-height: 1.1; font-weight: 600; text-wrap: wrap; }
      .bar button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; }
    </style>
  </head>
  <body>
    <div data-comp-world>
      <div class="column">
        <h1>Overcomplicated Counterproposals</h1>
      </div>
      <div class="column bar">
        <button type="button" data-comp-control="action" data-comp-accent="1" data-comp-inert="fixture: nothing to operate">Play</button>
      </div>
    </div>
  </body>
</html>
