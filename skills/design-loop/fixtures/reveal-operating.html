<!doctype html>
<!--
  The operating screen for reveal-comp.html (tubrief-v2 #114). "Download
  transcript" lives in a panel that a toggle opens in place, on the same URL.
  The correspondence check collected only what was visible at rest and what
  popups held, so a comp without the download passed.

  node <skill>/fixtures/serve.mjs 4795 -- node <skill>/scripts/measure-surface.mjs \
    --urls http://127.0.0.1:4795/reveal-comp.html \
    --baseline http://127.0.0.1:4795/reveal-operating.html \
    --viewport 1440 --height 900 --sweep off --out /tmp/reveal.json
  (from a project root that resolves Playwright)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>reveal operating</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { padding: 24px; display: grid; gap: 16px; justify-items: start; }
      button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; font: inherit; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <button type="button" aria-expanded="false" aria-controls="panel" data-comp-control="toggle" data-comp-accent="1">Show transcript</button>
      <section id="panel" hidden>
        <p>00:00 Hello</p>
        <button type="button" data-comp-control="download" data-comp-accent="1">Download transcript</button>
      </section>
    </main>
    <script>
      const toggle = document.querySelector("[aria-expanded]");
      toggle.addEventListener("click", () => {
        const open = toggle.getAttribute("aria-expanded") !== "true";
        toggle.setAttribute("aria-expanded", String(open));
        document.getElementById("panel").hidden = !open;
      });
      document.querySelector("#panel button").addEventListener("click", (e) => { e.target.textContent = "Download transcript"; e.target.dataset.n = String(Number(e.target.dataset.n ?? 0) + 1); });
      document.documentElement.setAttribute("data-comp-ready", "");
    </script>
  </body>
</html>
