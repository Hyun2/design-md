<!doctype html>
<!-- The surface held by shell-reload.html. "Rebuild" asks the shell to reload once, then toggles like "Mode". -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>surface</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { padding: 24px; display: flex; gap: 8px; }
      button { height: 36px; padding: 0 16px; border: 0; background: #0aa; color: #000; font: inherit; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <button type="button" data-comp-control="rebuild" data-comp-accent="1">Rebuild</button>
      <button type="button" data-comp-control="mode" data-comp-accent="1">Mode</button>
    </main>
    <script>
      for (const button of document.querySelectorAll("button")) {
        button.addEventListener("click", () => {
          if (button.textContent === "Rebuild") parent.postMessage("rebuild", "*");
          button.toggleAttribute("data-on");
          button.dataset.count = String(Number(button.dataset.count ?? 0) + 1);
        });
      }
      document.documentElement.setAttribute("data-comp-ready", "");
    </script>
  </body>
</html>
