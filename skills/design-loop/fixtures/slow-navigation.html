<!doctype html>
<!--
  Operability under a slow client-side route change (tubrief-v2 #111). A
  language link's loader fetch took 0.6-0.9s; the URL and the selection moved
  only after it returned. Reselecting the current language pressed a sibling,
  read the selection at a fixed 600ms, found it unmoved, and failed the
  current item as dead — on some runs, not others.

  Each press marks the control pending at once (the surface responds), then
  fetches with a 900ms delay, and only then moves the selection. The current
  item does nothing when pressed, so the check reselects it through a sibling.
  - Reading language: `aria-current` links whose route change rewrites the
    query, as TuBrief's language rung does.
  - View: a tablist whose selection waits on the same fetch, with no URL
    change — the sibling takes the selection without leaving the page.

  node <skill>/fixtures/serve.mjs 4791 -- node <skill>/scripts/measure-surface.mjs \
    --urls http://127.0.0.1:4791/slow-navigation.html \
    --viewport 1440 --height 900 --out /tmp/slow-navigation.json
  (from a project root that resolves Playwright; needs http, a file:// page cannot fetch)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>slow navigation fixture</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { padding: 24px; display: grid; gap: 16px; justify-items: start; }
      nav, [role=tablist] { display: flex; gap: 8px; }
      a, [role=tab] { height: 36px; padding: 0 16px; border: 0; background: #333; color: #eee; text-decoration: none; display: inline-flex; align-items: center; font: inherit; }
      [aria-current=true], [aria-selected=true] { background: #0aa; color: #000; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <nav aria-label="Reading language">
        <a href="?lang=ko" data-comp-control="ko" data-comp-accent="1" aria-current="true">한국어</a>
        <a href="?lang=de" data-comp-control="de">Deutsch</a>
      </nav>
      <div role="tablist" aria-label="View">
        <button type="button" role="tab" aria-selected="true">Summary</button>
        <button type="button" role="tab" aria-selected="false">Transcript</button>
      </div>
    </main>
    <script>
      const slowly = (control, move) => {
        control.setAttribute("data-pending", "");
        fetch("slow-navigation.html?delay=900").then(() => {
          control.removeAttribute("data-pending");
          move();
        });
      };
      for (const link of document.querySelectorAll("nav a")) {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          if (link.getAttribute("aria-current") === "true") return;
          slowly(link, () => {
            history.pushState(null, "", link.getAttribute("href"));
            for (const other of document.querySelectorAll("nav a")) other.removeAttribute("aria-current");
            link.setAttribute("aria-current", "true");
          });
        });
      }
      for (const tab of document.querySelectorAll("[role=tab]")) {
        tab.addEventListener("click", () => {
          if (tab.getAttribute("aria-selected") === "true") return;
          slowly(tab, () => {
            for (const other of document.querySelectorAll("[role=tab]")) other.setAttribute("aria-selected", "false");
            tab.setAttribute("aria-selected", "true");
          });
        });
      }
      document.documentElement.setAttribute("data-comp-ready", "");
    </script>
  </body>
</html>
