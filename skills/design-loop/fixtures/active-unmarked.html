<!doctype html>
<!--
  Criterion 3 regression fixture (tubrief-v2 #139): a surface shows a selected
  control (`aria-selected="true"` tab, `aria-current` link) but nothing carries
  `data-comp-active`, as when a comp's marker was lost moving into an operating
  component. The measurement must say criterion 3 went unmeasured, not leave
  `activeState` null under exit 0.
-->
<html lang="en" data-comp-ready>
  <head>
    <meta charset="utf-8" />
    <title>unmarked active state fixture</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 16px/1.5 sans-serif; }
      main { display: grid; justify-items: start; gap: 16px; padding: 24px; }
      nav, [role=tablist] { display: flex; gap: 4px; }
      a, [role=tab] { height: 36px; padding: 0 16px; border: 0; background: #2a2d33; color: #eee; text-decoration: none; display: inline-flex; align-items: center; font: inherit; }
      [aria-current=true], [aria-selected=true] { background: #0aa; color: #000; }
      p { margin: 0; max-width: 40em; }
    </style>
  </head>
  <body>
    <main data-comp-world>
      <nav aria-label="Reading language">
        <a href="#ko" data-comp-control="ko" aria-current="true" data-comp-accent="1">한국어</a>
        <a href="#en" data-comp-control="en">English</a>
      </nav>
      <div role="tablist" aria-label="View">
        <button type="button" role="tab" data-comp-control="summary" aria-selected="true">Summary</button>
        <button type="button" role="tab" data-comp-control="transcript" aria-selected="false">Transcript</button>
      </div>
      <p id="panel">Summary panel.</p>
    </main>
    <script>
      for (const link of document.querySelectorAll("nav a")) {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          for (const other of document.querySelectorAll("nav a")) other.removeAttribute("aria-current");
          link.setAttribute("aria-current", "true");
        });
      }
      for (const tab of document.querySelectorAll("[role=tab]")) {
        tab.addEventListener("click", () => {
          for (const other of document.querySelectorAll("[role=tab]")) other.setAttribute("aria-selected", "false");
          tab.setAttribute("aria-selected", "true");
          document.getElementById("panel").textContent = tab.textContent + " panel.";
        });
      }
    </script>
  </body>
</html>
