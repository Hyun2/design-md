<!doctype html>
<!--
  Input for `font-attribution.mjs` (config.mjs beside it).

  One web face, "Fixture Main" (KaTeX_Main-Regular.woff2, MIT — the LICENSE
  file beside it), claims Basic Latin and the Arrows block. Its cmap has → and
  lacks ♪ ▲. Everything else is an installed face and the policy decides:
  Latin, Digit, Hiragana, Katakana, Han anywhere; Symbol only inside
  [data-content-text]. Not Common, so the kana marks ー (U+30FC) and ・
  (U+30FB), Script=Common, pass only when classified by block. No punctuation
  outside the web face's range: it is Common too.

  Text sits where a default-state read never reaches:
    - the second tab's panel, and inside it a closed disclosure;
    - a card with content-visibility: auto far below the fold.
  The content element holds ♪, a Symbol the web face lacks: allowed there.
  The corpus (corpus.json) is set inside the same element.

  Mutations, each reverted next:
    - an undeclared script inside the closed disclosure (tubrief-v2 #75);
    - ▲ in interface text, outside the content element (#97);
    - the web face's range narrowed to leave → out, while its cmap has it (#94);
    - a second rule of the family claiming U+2600-26FF, whose file lacks ♪ (#95);
    - a character in corpus.json that falls to an installed face (#96).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>font-attribution fixture</title>
    <style>
      @font-face {
        font-family: "Fixture Main";
        src: url("./KaTeX_Main-Regular.woff2") format("woff2");
        unicode-range: U+0020-007E;
      }
      body { font-family: "Fixture Main", sans-serif; }
      [hidden] { display: none; }
      .far { margin-top: 3000px; content-visibility: auto; contain-intrinsic-size: 0 40px; }
    </style>
  </head>
  <body>
    <main>
      <p>Visible in the default state</p>
      <p><a href="#next">Next →</a></p>
      <p lang="ja">テーマ・ツール</p>
      <p data-content-text>♪ Tune</p>
      <div role="tablist">
        <button role="tab" aria-selected="true" aria-controls="panel-a" id="tab-a">First</button>
        <button role="tab" aria-selected="false" aria-controls="panel-b" id="tab-b">Second</button>
      </div>
      <section id="panel-a" role="tabpanel">
        <p>First panel</p>
      </section>
      <section id="panel-b" role="tabpanel" hidden>
        <p>Second panel</p>
        <button aria-expanded="false" aria-controls="inner">Show more</button>
        <div id="inner" hidden>
          <p>Hidden in a closed disclosure</p>
        </div>
      </section>
      <p class="far">Laid out only when content visibility is overridden</p>
    </main>
    <script>
      for (const tab of document.querySelectorAll('[role="tab"]')) {
        tab.addEventListener("click", () => {
          for (const t of document.querySelectorAll('[role="tab"]')) {
            const selected = t === tab;
            t.setAttribute("aria-selected", String(selected));
            document.getElementById(t.getAttribute("aria-controls")).hidden = !selected;
          }
        });
      }
      for (const toggle of document.querySelectorAll("[aria-expanded]")) {
        toggle.addEventListener("click", () => {
          const open = toggle.getAttribute("aria-expanded") !== "true";
          toggle.setAttribute("aria-expanded", String(open));
          document.getElementById(toggle.getAttribute("aria-controls")).hidden = !open;
        });
      }
    </script>
  </body>
</html>
