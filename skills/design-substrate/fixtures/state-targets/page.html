<!doctype html>
<!--
  The `capture.mjs` criterion 4 fixture. Exit 0 as committed. Each case names
  the defect a mutation revives; the mutation must exit 1 on that line.

  - card: the largest card is a static div with no hover. A hover sample that
    ignores interactivity picks it and reports 4a-hover (tubrief-v2 #101).
  - tabs-trigger: the selected tab is the largest and hover changes nothing on
    it; the unselected tab moves only its text (L 0.45 → 0.20). A sample that
    keeps current controls picks the selected tab (#104); a surface-only rule
    fails the unselected one (#103).
  - button: the largest button is a link variant whose hover only underlines.
    A surface-only rule fails it (#103).
  - badge: a button badge whose hover darkens its fill by L 0.067 and keeps its
    text above 4.5:1. Darken the hover fill to oklch(0.7 0 0) and the text
    falls under 4.5:1 and under idle: 2-hover (#102).
  - toggle: pressed, and a press turns it off, so it stays a hover sample.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; background: oklch(1 0 0); color: oklch(0.2 0 0); font: 16px/1.4 sans-serif; }
      main { padding: 24px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
      [data-slot]:focus-visible { outline: 2px solid oklch(0.3 0 0); outline-offset: 2px; }
      button { font: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

      [data-slot="card"] { width: 800px; height: 240px; background: oklch(0.937 0 0); }

      [data-slot="tabs-trigger"] { padding: 8px 16px; color: oklch(0.45 0 0); }
      [data-slot="tabs-trigger"]:hover { color: oklch(0.2 0 0); }
      [data-slot="tabs-trigger"][aria-selected="true"] { padding: 12px 48px; color: oklch(0.2 0 0); }

      [data-slot="button"] { padding: 8px 16px; background: oklch(0.937 0 0); }
      [data-slot="button"]:hover { background: oklch(0.87 0 0); }
      [data-slot="button"].link { padding: 16px 64px; background: none; color: oklch(0.42 0.1 250); }
      [data-slot="button"].link:hover { background: none; text-decoration: underline; }

      [data-slot="badge"] { padding: 4px 12px; background: oklch(0.937 0 0); color: oklch(0.4 0 0); }
      [data-slot="badge"]:hover { background: oklch(0.7 0 0); }

      [data-slot="toggle"] { padding: 8px 16px; background: oklch(0.904 0 0); }
      [data-slot="toggle"]:hover { background: oklch(0.84 0 0); }
    </style>
  </head>
  <body>
    <main>
      <div data-slot="card">Static card</div>
      <div role="tablist">
        <button data-slot="tabs-trigger" role="tab" aria-selected="true" data-active="">Selected tab</button>
        <button data-slot="tabs-trigger" role="tab" aria-selected="false">Other</button>
      </div>
      <div>
        <button data-slot="button">Save</button>
        <button data-slot="button" class="link">Go to home →</button>
      </div>
      <button data-slot="badge">All categories</button>
      <button data-slot="toggle" aria-pressed="true" data-pressed="">Bold</button>
    </main>
  </body>
</html>
